<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis</title>
<!--
  Jarvis — single-file edition.
  Just open this file in Chrome or Edge (double-click). Nothing to install.
  Click the gear, paste a FREE Google Gemini key (aistudio.google.com), and go.
-->
<style>
:root{
  --bg-0:#05060a;--bg-1:#0b1020;--glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.1);
  --stroke:rgba(255,255,255,.12);--text:#eaf0ff;--muted:rgba(234,240,255,.55);--accent:#6ea8ff;
  --accent-2:#b98cff;--danger:#ff6b6b;--radius:20px;--blur:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;color:var(--text);overflow:hidden}
body{background:radial-gradient(1200px 800px at 70% -10%,rgba(120,90,200,.25),transparent 60%),radial-gradient(900px 700px at 15% 110%,rgba(70,120,220,.22),transparent 55%),linear-gradient(160deg,var(--bg-1),var(--bg-0));display:flex;flex-direction:column}
.muted{color:var(--muted)}.small{font-size:12px}
.topbar{height:52px;display:flex;align-items:center;padding:0 18px;gap:10px}
.brand{font-weight:700;letter-spacing:3px;font-size:14px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.topbar .sp{flex:1}
.icon-btn{background:transparent;border:none;color:var(--muted);width:34px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;transition:.15s}
.icon-btn:hover{background:var(--glass-strong);color:var(--text)}
.stage{flex:1;display:grid;grid-template-columns:300px 1fr 300px;gap:18px;padding:2px 18px 20px;min-height:0}
.col{display:flex;flex-direction:column;gap:18px;min-height:0}
.col--center{align-items:center;justify-content:center;gap:10px}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel{padding:16px;display:flex;flex-direction:column;min-height:0}
.panel__head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:12px}
.weather__now{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.weather__temp{font-size:46px;font-weight:300;line-height:1}
.weather__desc{font-size:15px}
.wf{display:flex;justify-content:space-between;gap:4px}
.wf .day{text-align:center;flex:1;font-size:11px;color:var(--muted)}
.wf .day b{display:block;color:var(--text);font-size:13px;margin-top:4px;font-weight:500}.wf .day .ic{font-size:18px}
.tasks{flex:1}
.row-form{display:flex;gap:8px;margin-bottom:10px}
.row-form input,.chat-bar input,.modal input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:12px;padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.row-form input:focus,.chat-bar input:focus{border-color:var(--accent)}
.mini-btn{background:var(--glass-strong);border:1px solid var(--stroke);color:var(--text);border-radius:10px;width:34px;cursor:pointer;font-size:15px}
.mini-btn:hover{background:var(--accent);color:#04122e}
ul.list{list-style:none;overflow-y:auto;flex:1}
.tasks li{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.tasks li.done span{text-decoration:line-through;color:var(--muted)}
.tasks input[type=checkbox]{accent-color:var(--accent)}
.tasks .del{margin-left:auto;cursor:pointer;color:var(--muted)}.tasks .del:hover{color:var(--danger)}
.orb-wrap{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center}
#orb{width:420px;height:420px;max-width:100%;max-height:100%}
.orb-status{position:absolute;bottom:4%;left:0;right:0;text-align:center;pointer-events:none}
.status-line{font-size:14px;color:var(--muted)}.status-line.active{color:var(--accent)}
.transcript{width:100%;max-width:640px;max-height:120px;overflow-y:auto;font-size:14px;line-height:1.5;text-align:center;padding:0 8px}
.transcript .u{color:var(--muted)}.transcript .j{color:var(--text)}
.chat-bar{display:flex;align-items:center;gap:8px;width:100%;max-width:640px;padding:8px;border-radius:16px}
.mic-btn,.send-btn{border:none;cursor:pointer;width:40px;height:40px;border-radius:12px;font-size:16px;background:var(--glass-strong);color:var(--text);transition:.15s}
.mic-btn.listening{background:var(--accent);color:#04122e;box-shadow:0 0 20px var(--accent)}
.send-btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04122e}
.yt{flex:1}
.yt-player{border-radius:12px;overflow:hidden;margin-bottom:10px}.yt-player:empty{display:none}
.yt-player iframe{display:block;width:100%;border:0;border-radius:12px}
.music__now{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.music__title{font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:50}
.modal.hidden{display:none}
.modal__card{width:460px;max-width:92vw;padding:22px}
.modal__card label{display:block;font-size:13px;margin:14px 0 6px}
.modal__card input{width:100%}.modal .r{display:flex;gap:12px}.modal .r>div{flex:1}
.save-btn{margin-top:20px;width:100%;padding:11px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04122e;font-weight:600;font-size:14px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span> JARVIS</div>
  <div class="sp"></div>
  <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
</header>

<main class="stage">
  <section class="col">
    <div class="glass panel">
      <div class="panel__head"><span>Weather</span><span id="w-city" class="muted">—</span></div>
      <div class="weather__now">
        <div id="w-temp" class="weather__temp">--°</div>
        <div><div id="w-desc" class="weather__desc">Loading…</div><div id="w-sub" class="muted small">H --° · L --°</div></div>
      </div>
      <div id="w-fc" class="wf"></div>
    </div>
    <div class="glass panel tasks">
      <div class="panel__head"><span>Tasks &amp; Reminders</span><span id="t-count" class="muted small">0</span></div>
      <form id="t-form" class="row-form"><input id="t-input" placeholder="Add a task… (e.g. Call mom tomorrow)" autocomplete="off"/><button class="mini-btn">＋</button></form>
      <ul id="t-list" class="list"></ul>
    </div>
  </section>

  <section class="col col--center">
    <div class="orb-wrap"><canvas id="orb"></canvas><div class="orb-status"><div id="status" class="status-line">Loading…</div></div></div>
    <div id="transcript" class="transcript"></div>
    <form id="chat-form" class="chat-bar glass">
      <button type="button" id="btn-mic" class="mic-btn" title="Push to talk">🎙</button>
      <input id="chat-input" placeholder="Ask Jarvis anything…" autocomplete="off"/>
      <button type="submit" class="send-btn">➤</button>
    </form>
  </section>

  <section class="col">
    <div class="glass panel yt">
      <div class="panel__head"><span>Music (YouTube)</span></div>
      <form id="yt-form" class="row-form"><input id="yt-input" placeholder="Paste a YouTube link or video ID" autocomplete="off"/><button class="mini-btn">▶</button></form>
      <div id="yt-player" class="yt-player"></div>
      <div class="music__now"><div id="yt-title" class="music__title muted">Nothing playing</div></div>
    </div>
    <div class="glass panel">
      <div class="panel__head"><span>Notes</span></div>
      <ul id="n-list" class="list"><li class="note">Tip: say “Jarvis, what can you do?” or type below.</li></ul>
    </div>
  </section>
</main>

<div id="settings" class="modal hidden">
  <div class="glass modal__card">
    <div class="panel__head"><span>Settings</span><button id="s-close" class="icon-btn">✕</button></div>
    <label>Google Gemini API key <span class="muted small">(FREE, no card — aistudio.google.com → Get API key)</span></label>
    <input id="s-gemini" type="password" placeholder="AIza…"/>
    <label>ElevenLabs API key <span class="muted small">(optional — realistic voice, has a free tier)</span></label>
    <input id="s-eleven" type="password" placeholder="optional"/>
    <label>City</label><input id="s-city" placeholder="Brooklyn"/>
    <div class="r"><div><label>Latitude</label><input id="s-lat" placeholder="40.65"/></div><div><label>Longitude</label><input id="s-lon" placeholder="-73.95"/></div></div>
    <label>Wake word</label><input id="s-wake" placeholder="jarvis"/>
    <button id="s-save" class="save-btn">Save</button>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);

// ── Settings (saved in this browser) ─────────────────────────────────────────
const DEF={geminiApiKey:"",elevenApiKey:"",city:"Brooklyn",lat:40.65,lon:-73.95,wake:"jarvis",voiceId:"21m00Tcm4TlvDq8ikWAM"};
function getS(){try{return{...DEF,...JSON.parse(localStorage.getItem("jarvis")||"{}")}}catch(e){return{...DEF}}}
function setS(o){const m={...getS(),...o};localStorage.setItem("jarvis",JSON.stringify(m));return m}
let S=getS();

// ── Canvas-2D particle orb (no libraries, works offline) ─────────────────────
const orb=(()=>{
  const cv=$("orb"),ctx=cv.getContext("2d");
  const N=900,pts=[];
  for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;pts.push([Math.cos(th)*r,y,Math.sin(th)*r,Math.random()]);}
  let level=0,smooth=0,state="idle",t=0,dpr=Math.min(devicePixelRatio||1,2);
  function size(){const s=Math.min(cv.clientWidth,cv.clientHeight)||420;cv.width=s*dpr;cv.height=s*dpr;}
  const COL={idle:[191,212,255],listening:[110,168,255],speaking:[185,140,255]};
  function frame(){
    t+=0.016;smooth+=(level-smooth)*0.15;size();
    const w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.34;
    ctx.clearRect(0,0,w,h);
    const c=COL[state]||COL.idle;
    // glow
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.6);
    g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${0.10+smooth*0.25})`);g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    const cosY=Math.cos(t*0.35),sinY=Math.sin(t*0.35),tilt=Math.sin(t*0.2)*0.25;
    const push=1+(state==="idle"?Math.sin(t*1.2)*0.04+0.04:0.08+smooth*0.5);
    for(let i=0;i<N;i++){
      let x=pts[i][0],y=pts[i][1],z=pts[i][2];const rnd=pts[i][3];
      const wob=1+Math.sin(t*2+rnd*12)*0.03*(0.5+smooth);
      x*=push*wob;y*=push*wob;z*=push*wob;
      // rotate Y then X-tilt
      let X=x*cosY - z*sinY, Z=x*sinY + z*cosY;
      let Y=y*Math.cos(tilt) - Z*Math.sin(tilt); Z=y*Math.sin(tilt)+Z*Math.cos(tilt);
      const persp=1/(2.2 - Z*0.6);
      const px=cx+X*R*persp, py=cy+Y*R*persp;
      const depth=(Z+1.4)/2.8, a=0.25+depth*0.75, sz=(0.6+depth*1.7)*dpr;
      ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;
      ctx.beginPath();ctx.arc(px,py,sz,0,6.283);ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return{setLevel:v=>level=Math.max(0,Math.min(1,v)),setState:s=>state=s};
})();

// ── Status + transcript ──────────────────────────────────────────────────────
function status(txt,on){const e=$("status");e.textContent=txt;e.classList.toggle("active",!!on);}
function push(who,txt){const el=$("transcript"),d=document.createElement("div");d.className=who==="you"?"u":"j";d.textContent=(who==="you"?"You: ":"Jarvis: ")+txt;el.appendChild(d);el.scrollTop=el.scrollHeight;while(el.children.length>12)el.removeChild(el.firstChild);}
function notify(title,body){if(!("Notification"in window))return;const go=()=>new Notification(title,{body});if(Notification.permission==="granted")go();else if(Notification.permission!=="denied")Notification.requestPermission().then(p=>p==="granted"&&go());}

// ── Weather (free, no key) ───────────────────────────────────────────────────
const WC={0:["Clear","☀️"],1:["Mainly clear","🌤"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],45:["Fog","🌫"],48:["Fog","🌫"],51:["Drizzle","🌦"],53:["Drizzle","🌦"],55:["Drizzle","🌧"],61:["Rain","🌧"],63:["Rain","🌧"],65:["Heavy rain","🌧"],71:["Snow","🌨"],73:["Snow","🌨"],75:["Snow","❄️"],80:["Showers","🌦"],81:["Showers","🌧"],82:["Showers","⛈"],95:["Storm","⛈"],96:["Storm","⛈"],99:["Storm","⛈"]};
async function loadWeather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${S.lat}&longitude=${S.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`;
    const d=await(await fetch(u)).json();const c=d.current,[desc,ic]=WC[c.weather_code]||["—","🌡"];
    $("w-city").textContent=S.city||"";$("w-temp").textContent=Math.round(c.temperature_2m)+"°";$("w-desc").textContent=ic+" "+desc;
    $("w-sub").textContent=`H ${Math.round(d.daily.temperature_2m_max[0])}° · L ${Math.round(d.daily.temperature_2m_min[0])}°`;
    const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    $("w-fc").innerHTML=d.daily.time.slice(0,6).map((tt,i)=>{const[,ii]=WC[d.daily.weather_code[i]]||["","🌡"];return `<div class="day">${days[new Date(tt).getDay()]}<span class="ic">${ii}</span><b>${Math.round(d.daily.temperature_2m_max[i])}°</b></div>`}).join("");
  }catch(e){$("w-desc").textContent="Weather unavailable"}
}

// ── Tasks ────────────────────────────────────────────────────────────────────
let tasks=JSON.parse(localStorage.getItem("jarvis-tasks")||"[]");
function saveTasks(){localStorage.setItem("jarvis-tasks",JSON.stringify(tasks));renderTasks();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderTasks(){
  $("t-count").textContent=tasks.filter(t=>!t.done).length+" open";
  $("t-list").innerHTML=tasks.map((t,i)=>`<li class="${t.done?"done":""}"><input type="checkbox" data-i="${i}" ${t.done?"checked":""}/><span>${esc(t.text)}${t.due?" · "+t.due:""}</span><span class="del" data-d="${i}">✕</span></li>`).join("");
  $("t-list").querySelectorAll("input").forEach(cb=>cb.onchange=()=>{tasks[cb.dataset.i].done=cb.checked;saveTasks();});
  $("t-list").querySelectorAll(".del").forEach(x=>x.onclick=()=>{tasks.splice(+x.dataset.d,1);saveTasks();});
}
$("t-form").onsubmit=e=>{e.preventDefault();const v=$("t-input").value.trim();if(!v)return;let due="";if(/tomorrow/i.test(v))due=new Date(Date.now()+864e5).toLocaleDateString();else if(/today|tonight/i.test(v))due=new Date().toLocaleDateString();tasks.push({text:v,done:false,due,notified:false});$("t-input").value="";saveTasks();};
setInterval(()=>{const today=new Date().toLocaleDateString();let ch=false;tasks.forEach(t=>{if(!t.done&&!t.notified&&t.due===today){t.notified=true;ch=true;notify("Reminder",t.text);push("jarvis","Reminder: "+t.text);}});if(ch)saveTasks();},60000);

// ── Memory + Chat (free Google Gemini) ───────────────────────────────────────
let convo=[],memory=JSON.parse(localStorage.getItem("jarvis-mem")||"[]");
function remember(txt){if(/\b(remember|note that|don'?t forget|i have to|i need to|tomorrow i|my plan)\b/i.test(txt)){memory.push({text:txt,at:new Date().toISOString()});localStorage.setItem("jarvis-mem",JSON.stringify(memory));}}
function sysPrompt(){
  const now=new Date();
  const tl=tasks.map(t=>`- ${t.text}${t.due?" (due "+t.due+")":""}${t.done?" [done]":""}`).join("\n")||"(none)";
  const ml=memory.slice(-30).map(m=>"- "+m.text).join("\n")||"(none)";
  return `You are Jarvis, a warm, witty, concise desktop assistant. Keep replies to 1-3 sentences.\nToday is ${now.toDateString()}, local time ${now.toLocaleTimeString()}.\nCurrent tasks:\n${tl}\nThings the user told you to remember:\n${ml}`;
}
async function ask(text){
  push("you",text);status("Thinking…",true);
  if(!S.geminiApiKey){const m="I need a free Gemini key first — click the ⚙ gear, paste a key from aistudio.google.com (it's free), and Save.";push("jarvis",m);say(m);status("Ready");return;}
  convo.push({role:"user",content:text});
  try{
    const contents=convo.slice(-12).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${S.geminiApiKey}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sysPrompt()}]},contents})});
    const d=await r.json();
    if(!r.ok){const m="Gemini error: "+((d.error&&d.error.message)||r.status);push("jarvis",m);status("Ready");return;}
    const parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    const reply=parts.filter(p=>p.text).map(p=>p.text).join("").trim()||"…";
    convo.push({role:"assistant",content:reply});push("jarvis",reply);say(reply);remember(text);
  }catch(e){const m="Could not reach Gemini: "+e.message;push("jarvis",m);status("Ready");}
}
$("chat-form").onsubmit=e=>{e.preventDefault();const v=$("chat-input").value.trim();if(!v)return;$("chat-input").value="";ask(v);};

// ── Voice: speak (ElevenLabs if key, else built-in) + listen ────────────────
let speaking=false;
function speakPulse(){if(!speaking)return;orb.setLevel(0.3+Math.random()*0.5);setTimeout(speakPulse,90);}
async function say(text){
  if(S.elevenApiKey){
    try{
      const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${S.voiceId}`,{method:"POST",headers:{"xi-api-key":S.elevenApiKey,"content-type":"application/json",accept:"audio/mpeg"},body:JSON.stringify({text,model_id:"eleven_turbo_v2_5",voice_settings:{stability:.5,similarity_boost:.75}})});
      if(r.ok){const buf=await r.arrayBuffer();const url=URL.createObjectURL(new Blob([buf],{type:"audio/mpeg"}));const a=new Audio(url);speaking=true;orb.setState("speaking");
        const ac=new AudioContext(),src=ac.createMediaElementSource(a),an=ac.createAnalyser();an.fftSize=256;src.connect(an);an.connect(ac.destination);const dt=new Uint8Array(an.frequencyBinCount);
        (function tick(){if(a.paused||a.ended)return;an.getByteFrequencyData(dt);let s=0;for(let i=0;i<dt.length;i++)s+=dt[i];orb.setLevel(Math.min(1,s/dt.length/70));requestAnimationFrame(tick);})();
        a.onended=()=>{speaking=false;orb.setState("idle");orb.setLevel(0);status("Ready");};a.play();return;}
    }catch(e){/* fall back to browser voice */}
  }
  if(!("speechSynthesis"in window)){status("Ready");return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.02;
  const vs=speechSynthesis.getVoices();const pv=vs.find(v=>/google|natural|premium/i.test(v.name))||vs[0];if(pv)u.voice=pv;
  u.onstart=()=>{speaking=true;orb.setState("speaking");speakPulse();};
  u.onend=()=>{speaking=false;orb.setState("idle");orb.setLevel(0);status("Ready");};
  speechSynthesis.speak(u);
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null,running=false,active=false,manual=false,fatal=false;
function startListening(){
  if(!SR){status("Voice needs Chrome or Edge — you can still type below.");return;}
  recog=new SR();recog.continuous=true;recog.interimResults=true;recog.lang="en-US";
  recog.onstart=()=>status(`Listening for “${S.wake||"Jarvis"}”…`);
  recog.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){fatal=true;running=false;status("🎙 Microphone blocked — allow it (address-bar icon) and reopen the file.");}};
  recog.onend=()=>{if(running&&!fatal){try{recog.start()}catch(e){}}};
  recog.onresult=ev=>{
    let fin="",intr="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else intr+=r[0].transcript;}
    const low=(fin||intr).trim().toLowerCase();
    if(!active&&!manual&&S.wake&&low.includes(S.wake.toLowerCase())){active=true;orb.setState("listening");status("Yes? I'm listening…",true);return;}
    if(fin&&(active||manual)){let c=fin.trim();if(S.wake){const idx=c.toLowerCase().indexOf(S.wake.toLowerCase());if(idx>=0)c=c.slice(idx+S.wake.length).trim();}if(c){orb.setState("idle");ask(c);}active=false;manual=false;}
  };
  running=true;try{recog.start()}catch(e){}
  // mic meter → orb
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(st).connect(an);const dt=new Uint8Array(an.frequencyBinCount);
    (function tick(){an.getByteFrequencyData(dt);let s=0;for(let i=0;i<dt.length;i++)s+=dt[i];if(!speaking)orb.setLevel(Math.min(1,s/dt.length/90));requestAnimationFrame(tick);})();
  }).catch(()=>status("🎙 Allow microphone for voice (address-bar icon), then reopen this file."));
}
$("btn-mic").onclick=()=>{if(!SR){status("Voice needs Chrome or Edge.");return;}manual=true;active=true;$("btn-mic").classList.add("listening");orb.setState("listening");status("Listening…",true);try{recog.start()}catch(e){}setTimeout(()=>$("btn-mic").classList.remove("listening"),4000);};

// ── YouTube by link/ID ───────────────────────────────────────────────────────
let ytPlayer=null,ytReady=false,pending=null;
function loadYT(){window.onYouTubeIframeAPIReady=()=>{ytPlayer=new YT.Player("yt-player",{height:"150",width:"100%",playerVars:{autoplay:1,rel:0,modestbranding:1},events:{onReady:()=>{ytReady=true;if(pending){cueYT(pending);pending=null;}}}});};const t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";document.head.appendChild(t);}
function ytId(s){s=s.trim();const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(m)return m[1];if(/^[\w-]{11}$/.test(s))return s;return null;}
function cueYT(id){if(ytReady&&ytPlayer)ytPlayer.loadVideoById(id);else pending=id;$("yt-title").textContent="Playing…";$("yt-title").classList.remove("muted");}
$("yt-form").onsubmit=e=>{e.preventDefault();const id=ytId($("yt-input").value);if(!id){$("yt-title").textContent="Paste a valid YouTube link/ID";return;}$("yt-input").value="";cueYT(id);};

// ── Settings modal ───────────────────────────────────────────────────────────
$("btn-settings").onclick=()=>{$("s-gemini").value=S.geminiApiKey;$("s-eleven").value=S.elevenApiKey;$("s-city").value=S.city;$("s-lat").value=S.lat;$("s-lon").value=S.lon;$("s-wake").value=S.wake;$("settings").classList.remove("hidden");};
$("s-close").onclick=()=>$("settings").classList.add("hidden");
$("s-save").onclick=async()=>{S=setS({geminiApiKey:$("s-gemini").value.trim(),elevenApiKey:$("s-eleven").value.trim(),city:$("s-city").value.trim(),lat:parseFloat($("s-lat").value)||S.lat,lon:parseFloat($("s-lon").value)||S.lon,wake:$("s-wake").value.trim()||"jarvis"});$("settings").classList.add("hidden");await loadWeather();};

// ── Boot ─────────────────────────────────────────────────────────────────────
(async function(){
  await loadWeather();renderTasks();loadYT();startListening();
  const h=new Date().getHours(),part=h<12?"morning":h<18?"afternoon":"evening";
  status(`Good ${part}. Say “${S.wake||"Jarvis"}” or type below.`);
  if(!S.geminiApiKey)setTimeout(()=>status("Click ⚙ and paste a FREE Gemini key to switch on my brain."),3500);
})();
</script>
