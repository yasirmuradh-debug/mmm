<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis · API Test Console</title>
<!--
  Standalone test console for the Jarvis backend.
  It talks ONLY to this server's API (/api/*). No API key is present in this
  page — the key stays on the server (.env). Open at http://localhost:4321/test.html
-->
<style>
:root{--bg:#06070d;--panel:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.12);--text:#eaf0ff;--muted:rgba(234,240,255,.55);--accent:#6ea8ff;--accent2:#b98cff;--ok:#3ddc84;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;color:var(--text);height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(1000px 700px at 80% -10%,rgba(120,90,200,.22),transparent 60%),radial-gradient(800px 600px at 10% 110%,rgba(70,120,220,.2),transparent 55%),linear-gradient(160deg,#0b1020,var(--bg))}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--stroke);backdrop-filter:blur(12px)}
.brand{font-weight:700;letter-spacing:2px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--stroke);color:var(--muted);display:flex;align-items:center;gap:6px}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .d{background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill.bad .d{background:var(--bad)}
.sp{flex:1}
button{cursor:pointer;font:inherit}
.iconbtn{background:var(--panel);border:1px solid var(--stroke);color:var(--text);border-radius:10px;padding:6px 12px;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.1)}
main{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;max-width:900px;width:100%;margin:0 auto}
.msg{display:flex;gap:12px;max-width:100%}
.msg .who{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.msg.user .who{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04122e}
.msg.ai .who{background:var(--panel);border:1px solid var(--stroke)}
.bubble{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:12px 14px;line-height:1.55;font-size:14.5px;overflow-x:auto}
.msg.user .bubble{background:rgba(110,168,255,.12)}
.bubble pre{background:#0a0e1c;border:1px solid var(--stroke);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.bubble p code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{background:transparent;border:1px solid var(--stroke);color:var(--muted);border-radius:8px;padding:3px 10px;font-size:12px}
.tools button:hover{color:var(--text);border-color:var(--accent)}
.think{display:inline-flex;gap:4px;align-items:center}
.think i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
footer{border-top:1px solid var(--stroke);padding:14px 18px;backdrop-filter:blur(12px)}
.composer{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:14px;color:var(--text);padding:12px 14px;font:inherit;font-size:14.5px;resize:none;max-height:160px;outline:none}
textarea:focus{border-color:var(--accent)}
.cbtn{width:46px;height:46px;border-radius:13px;border:none;font-size:17px;color:#04122e;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.mic{background:var(--panel);border:1px solid var(--stroke);color:var(--text)}
.mic.on{background:var(--accent);color:#04122e;box-shadow:0 0 16px var(--accent)}
.stopbtn{background:var(--bad);color:#fff}
.metrics{max-width:900px;margin:8px auto 0;display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.metrics b{color:var(--text);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
.modal.open{display:flex}
.card{background:#0b1020;border:1px solid var(--stroke);border-radius:16px;padding:22px;width:420px;max-width:92vw}
.card h3{margin-bottom:6px}.card label{display:block;font-size:13px;margin:14px 0 6px;color:var(--muted)}
.card input,.card select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:10px;color:var(--text);padding:9px 11px;font:inherit}
.card .save{margin-top:18px;width:100%;padding:11px;border:none;border-radius:11px;color:#04122e;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2))}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
</style>
</head>
<body>
<header>
  <span class="brand">JARVIS · API Console</span>
  <span id="conn" class="pill"><span class="d"></span><span>connecting…</span></span>
  <span id="model" class="pill"><span class="d"></span><span>model —</span></span>
  <span class="sp"></span>
  <button class="iconbtn" id="clear">Clear</button>
  <button class="iconbtn" id="export">Export</button>
  <button class="iconbtn" id="cog">⚙ Settings</button>
</header>

<main id="chat"></main>

<footer>
  <div class="composer">
    <button class="cbtn mic" id="mic" title="Voice input">🎙</button>
    <textarea id="input" rows="1" placeholder="Message Jarvis…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="cbtn" id="send" title="Send">➤</button>
    <button class="cbtn stopbtn" id="stop" title="Stop" style="display:none">■</button>
  </div>
  <div class="metrics">
    <span>Latency: <b id="m-lat">—</b></span>
    <span>First token: <b id="m-ttft">—</b></span>
    <span>Tokens: <b id="m-tok">—</b></span>
    <span id="m-speak"></span>
  </div>
</footer>

<div class="modal" id="settings">
  <div class="card">
    <h3>Settings</h3>
    <div class="muted" style="font-size:12px">The NVIDIA key lives in the server's <code>.env</code> — not here.</div>
    <label>AI model</label>
    <select id="s-provider">
      <option value="nvidia">NVIDIA GPT-OSS-120B</option>
      <option value="groq">Groq Llama-3.3-70B (free)</option>
      <option value="gemini">Google Gemini 2.0 Flash (free)</option>
      <option value="claude">Anthropic Claude (paid)</option>
    </select>
    <label>Temperature: <span id="s-temp-v">0.7</span></label>
    <input type="range" id="s-temp" min="0" max="2" step="0.1" value="0.7" />
    <label>Max tokens</label>
    <input type="number" id="s-max" value="1024" min="64" max="8192" />
    <label>Speaking speed: <span id="s-rate-v">1.0</span></label>
    <input type="range" id="s-rate" min="0.6" max="1.6" step="0.05" value="1.0" />
    <label>Wake word</label>
    <input id="s-wake" placeholder="jarvis" />
    <button class="save" id="s-save">Save</button>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const chatEl=$("#chat");
let messages=[];              // {role, content}
let controller=null;          // AbortController for the active stream
let speakRate=1.0, ttsOn=true;

// ── connection + model status ────────────────────────────────────────────────
async function refreshStatus(){
  try{
    const s=await (await fetch("/api/status")).json();
    setPill($("#conn"),"ok","online");
    setPill($("#model"), s.hasKey?"ok":"bad", s.model + (s.hasKey?"":" · no key"));
    $("#s-provider").value=s.provider; $("#s-temp").value=s.temperature; $("#s-temp-v").textContent=s.temperature;
    $("#s-max").value=s.maxTokens;
  }catch(e){ setPill($("#conn"),"bad","offline"); }
}
function setPill(el,cls,text){el.className="pill "+cls;el.querySelector("span:last-child").textContent=text;}

// ── tiny markdown (safe) ─────────────────────────────────────────────────────
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(t){
  const blocks=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{blocks.push(`<pre><code>${esc(code.replace(/\n$/,""))}</code></pre>`);return "␀"+(blocks.length-1)+"␀";});
  t=esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>")
    .replace(/\n/g,"<br>");
  t=t.replace(/␀(\d+)␀/g,(_,i)=>blocks[i]);
  return "<p>"+t+"</p>";
}

// ── render ───────────────────────────────────────────────────────────────────
function addMsg(role,html){
  const el=document.createElement("div");el.className="msg "+(role==="user"?"user":"ai");
  el.innerHTML=`<div class="who">${role==="user"?"You":"J"}</div><div style="flex:1;min-width:0"><div class="bubble">${html}</div></div>`;
  chatEl.appendChild(el);chatEl.scrollTop=chatEl.scrollHeight;return el;
}
function tools(el,text){
  const box=el.querySelector("div[style]");const t=document.createElement("div");t.className="tools";
  t.innerHTML=`<button data-a="copy">Copy</button><button data-a="regen">Regenerate</button>`;
  box.appendChild(t);
  t.querySelector('[data-a=copy]').onclick=()=>navigator.clipboard.writeText(text);
  t.querySelector('[data-a=regen]').onclick=()=>{ if(controller)return; messages=messages.slice(0,-1); el.remove(); run(); };
}

// ── send / stream ────────────────────────────────────────────────────────────
async function run(){
  controller=new AbortController();
  $("#send").style.display="none";$("#stop").style.display="";
  const aiEl=addMsg("ai",'<span class="think"><i></i><i></i><i></i></span>');
  const bubble=aiEl.querySelector(".bubble");
  let text="",t0=performance.now(),ttft=null;
  try{
    const res=await fetch("/api/chat/stream",{method:"POST",headers:{"content-type":"application/json"},signal:controller.signal,
      body:JSON.stringify({messages:messages.slice(-16),system:"You are Jarvis, a helpful, concise assistant. Use Markdown."})});
    const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop();
      for(const ln of lines){const s=ln.trim();if(!s.startsWith("data:"))continue;
        let j;try{j=JSON.parse(s.slice(5).trim());}catch(e){continue;}
        if(j.type==="delta"){ if(ttft===null){ttft=performance.now()-t0;$("#m-ttft").textContent=Math.round(ttft)+" ms";} text+=j.text; bubble.innerHTML=md(text); chatEl.scrollTop=chatEl.scrollHeight; }
        else if(j.type==="meta"){ setPill($("#model"),"ok",j.model); }
        else if(j.type==="done"){ $("#m-lat").textContent=(j.latencyMs||Math.round(performance.now()-t0))+" ms"; if(j.usage)$("#m-tok").textContent=`${j.usage.prompt_tokens||"?"}+${j.usage.completion_tokens||"?"} = ${j.usage.total_tokens||"?"}`; }
        else if(j.type==="error"){ text=text||("⚠️ "+j.text); bubble.innerHTML=md(text); }
      }
    }
  }catch(e){ if(e.name!=="AbortError") bubble.innerHTML=md("⚠️ "+e.message); }
  if(!text)text=bubble.textContent||"";
  messages.push({role:"assistant",content:text});
  tools(aiEl,text); if(ttsOn&&text)speak(text);
  controller=null;$("#send").style.display="";$("#stop").style.display="none";
}
function sendMsg(){
  const v=$("#input").value.trim();if(!v||controller)return;
  $("#input").value="";$("#input").style.height="auto";
  messages.push({role:"user",content:v});addMsg("user",md(v));run();
}
$("#send").onclick=sendMsg;
$("#stop").onclick=()=>{if(controller)controller.abort();};
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px";});
$("#clear").onclick=()=>{messages=[];chatEl.innerHTML="";};
$("#export").onclick=()=>{const blob=new Blob([JSON.stringify(messages,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jarvis-conversation.json";a.click();};

// ── TTS (browser) with interruption ──────────────────────────────────────────
function speak(t){ if(!("speechSynthesis"in window))return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g," (code) ").replace(/[*`#>_-]/g,"")); u.rate=speakRate;
  $("#m-speak").textContent="🔊 speaking"; u.onend=()=>$("#m-speak").textContent=""; speechSynthesis.speak(u); }

// ── Voice input (Web Speech) — interrupts TTS on mic start ────────────────────
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
$("#mic").onclick=()=>{
  if(!SR){alert("Voice input needs Chrome or Edge.");return;}
  if(listening){rec.stop();return;}
  speechSynthesis.cancel();
  rec=new SR();rec.lang="en-US";rec.interimResults=true;
  let finalT="";
  rec.onstart=()=>{listening=true;$("#mic").classList.add("on");};
  rec.onerror=e=>{ if(e.error==="not-allowed")alert("Allow microphone access (address-bar icon)."); };
  rec.onend=()=>{listening=false;$("#mic").classList.remove("on"); if(finalT.trim()){$("#input").value=finalT.trim();sendMsg();} };
  rec.onresult=ev=>{finalT="";for(const r of ev.results)finalT+=r[0].transcript; $("#input").value=finalT;};
  rec.start();
};

// ── Settings ─────────────────────────────────────────────────────────────────
$("#cog").onclick=()=>$("#settings").classList.add("open");
$("#settings").onclick=e=>{if(e.target.id==="settings")$("#settings").classList.remove("open");};
$("#s-temp").oninput=e=>$("#s-temp-v").textContent=e.target.value;
$("#s-rate").oninput=e=>{$("#s-rate-v").textContent=e.target.value;speakRate=parseFloat(e.target.value);};
$("#s-save").onclick=async()=>{
  await fetch("/api/settings",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({aiProvider:$("#s-provider").value,temperature:parseFloat($("#s-temp").value),maxTokens:parseInt($("#s-max").value)||1024,wakeWord:($("#s-wake").value.trim()||"jarvis")})});
  $("#settings").classList.remove("open"); refreshStatus();
};

// ── keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="/"){e.preventDefault();$("#input").focus();} if(e.key==="Escape"&&controller)controller.abort(); });

refreshStatus(); setInterval(refreshStatus,15000);
addMsg("ai",md("Hi, I'm **Jarvis**. This is the API test console — it streams from your backend model. Ask me anything, or hit 🎙 to talk."));
</script>
</body>
</html>
