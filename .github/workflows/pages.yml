# Publishes the Jarvis web UI (the src/ folder) to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source = "GitHub Actions". (The repo must be Public for free Pages.)
name: Deploy Jarvis to GitHub Pages

on:
  push:
    branches:
      - claude/jarvis-desktop-assistant-ewbz2d
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
